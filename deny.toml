[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]

[bans]
multiple-versions = "allow"
deny = [
    { crate = "sentry-core", reason = "no telemetry or crash reporting" },
    { crate = "opentelemetry", reason = "no telemetry or crash reporting" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/Dannesk/dannesk-btc-codec"]
